<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Travel — meghamsh.b</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/mb3-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/mb3-16.png">
<link rel="apple-touch-icon" href="/assets/mb3-apple-touch.png">
<meta name="theme-color" content="#3D0F18">
<meta name="description" content="Where I've been — cities I've lived in, worked from, or passed through.">

<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Schibsted+Grotesk:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0708; --ink:#F4EFEC; --muted:#C3B9B5; --dim:#988C89;
    --red:#A8332B; --red-bright:#F5392B; --line:rgba(255,255,255,0.10);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:'Schibsted Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased;color-scheme:dark;}
  a{color:#E6DED9;text-decoration:none;} a:hover{color:var(--red);}
  .bg-img{position:fixed;inset:0;z-index:-2;background-image:url('/assets/bg-v8.png');background-size:cover;background-position:center;}
  .bg-tint{position:fixed;inset:0;z-index:-1;background:radial-gradient(120% 80% at 30% 10%,rgba(10,6,7,0),rgba(8,5,6,0.55) 70%);}

  header{position:sticky;top:0;z-index:40;background:rgba(12,8,9,0.15);
    backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);
    border-bottom:1px solid rgba(255,255,255,0.08);}
  nav{max-width:1180px;margin:0 auto;padding:14px 30px;display:flex;align-items:center;gap:22px;}
  .logo{font-family:'Instrument Serif',serif;font-style:italic;font-size:26px;line-height:1;color:var(--ink);}
  .nav-links{display:flex;align-items:center;gap:22px;font-size:14px;color:var(--dim);}
  .nav-links a{color:var(--dim);} .nav-links a.active{color:var(--ink);font-weight:600;} .nav-links a:hover{color:#fff;}
  .socials{display:flex;align-items:center;gap:14px;color:var(--dim);}
  .socials a{display:flex;color:var(--dim);} .socials a:hover{color:var(--red-bright);}
  .spacer{flex:1;}

  /* stage: globe fixed on the right, content column on the left */
  .stage{position:relative;max-width:1180px;margin:0 auto;padding:0 30px;min-height:calc(100vh - 56px);}
  .globe-wrap{position:fixed;top:52%;right:max(-10vw,-160px);transform:translateY(-50%);
    width:min(72vw,860px);height:min(72vw,860px);z-index:0;pointer-events:auto;}
  .globe-wrap::before{content:"";position:absolute;inset:8%;border-radius:50%;
    background:radial-gradient(circle at 42% 38%,rgba(168,51,43,0.16),rgba(168,51,43,0.05) 45%,rgba(0,0,0,0) 66%);filter:blur(2px);}
  #globe{position:relative;width:100%;height:100%;display:block;cursor:grab;}
  #globe:active{cursor:grabbing;}
  #globe-tip{position:fixed;pointer-events:none;transform:translate(-50%,-140%);z-index:5;
    background:rgba(12,8,9,0.92);border:1px solid var(--line);border-radius:8px;padding:6px 10px;
    font-size:12px;color:var(--ink);white-space:nowrap;opacity:0;transition:opacity .15s;}

  .col{position:relative;z-index:2;max-width:600px;padding:60px 0 40px;}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;letter-spacing:0.24em;text-transform:uppercase;color:#F0E7E2;}
  h1{margin:6px 0 0;font-family:'Instrument Serif',serif;font-weight:400;font-size:66px;line-height:0.98;letter-spacing:-0.01em;color:#F7F1EC;}
  .subtitle{margin:20px 0 0;max-width:440px;font-size:18px;line-height:1.55;color:var(--muted);text-wrap:pretty;text-shadow:0 1px 10px rgba(0,0,0,0.5);}

  .stats{display:flex;gap:34px;margin:34px 0 0;}
  .stat .n{font-family:'Instrument Serif',serif;font-size:44px;line-height:1;color:#F7F1EC;}
  .stat .l{margin-top:4px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:var(--dim);}

  .timeline{margin:30px 0 0;max-height:46vh;overflow-y:auto;padding-right:14px;
    -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 20px,#000 calc(100% - 26px),transparent 100%);
            mask-image:linear-gradient(180deg,transparent 0,#000 20px,#000 calc(100% - 26px),transparent 100%);}
  .timeline::-webkit-scrollbar{width:5px;} .timeline::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.14);border-radius:3px;}
  .year-label{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:0.14em;color:var(--dim);margin:16px 0 6px;}
  .entry{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:16px;
    padding:10px 12px;border-radius:10px;cursor:pointer;transition:background .18s;}
  .entry:hover,.entry.active{background:rgba(255,255,255,0.06);}
  .entry .city{font-size:17px;font-weight:600;color:#F4EFEC;}
  .entry .country{font-size:13px;color:var(--muted);display:block;margin-top:1px;}
  .entry .when{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--dim);}
  .entry.active .city{color:var(--red-bright);}
  .updated{margin:20px 0 0;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.08em;color:var(--dim);}

  @media (max-width:860px){
    html,body{overflow-x:hidden;}
    nav{padding:12px 16px;gap:12px;} .nav-links{display:none;}
    .stage{padding:0 16px;}
    .globe-wrap{position:relative;top:auto;right:auto;transform:none;margin:24px auto -6vw;width:min(90vw,420px);height:min(90vw,420px);}
    .col{padding:24px 0 40px;max-width:100%;}
    h1{font-size:44px;} .subtitle{font-size:16px;max-width:100%;}
    .timeline{max-height:none;overflow:visible;-webkit-mask-image:none;mask-image:none;}
    .stats{gap:24px;}
  }
</style>
</head>
<body>

<div class="bg-tint" aria-hidden="true"></div>

      <a href="https://www.instagram.com/meghamshb/" target="_blank" rel="noreferrer" aria-label="Instagram"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.35" aria-hidden="true"><rect x="1.6" y="1.6" width="12.8" height="12.8" rx="4"/><circle cx="8" cy="8" r="3.1"/><circle cx="11.9" cy="4.1" r="0.85" fill="currentColor" stroke="none"/></svg></a>

<div class="stage">
  <div class="globe-wrap"><canvas id="globe"></canvas></div>
  <div id="globe-tip"></div>

  <div class="col">
    <div class="eyebrow">05. Travel</div>
    <h1>Where I've Been</h1>
    <p class="subtitle">Every city I've lived in, worked from, or passed through. Drag the globe, or pick a place to fly to it.</p>

    <div class="stats" id="stats"></div>

    <div class="timeline" id="timeline"></div>
    <div class="updated" id="last-updated">Last updated —</div>
  </div>
</div>

<script src="vendor/d3.min.js"></script>
<script>
/* ============================================================
   EDIT YOUR TRAVEL HERE — one list drives stats, globe & log.
   Each place: city, country, lat, lng, date "YYYY-MM".
   ============================================================ */
const PLACES = [
  { city:"Hong Kong",  country:"Hong Kong", lat:22.3193, lng:114.1694, date:"2025-08", note:"Studying CE at HKU" },
  { city:"Jammu",      country:"India",     lat:32.7266, lng:74.8570,  date:"2024-06", note:"Research @ IIT Jammu" },
  { city:"Bengaluru",  country:"India",     lat:12.9716, lng:77.5946,  date:"2023-06", note:"Research @ IISc" },
  { city:"Hyderabad",  country:"India",     lat:17.3850, lng:78.4867,  date:"2006-01", note:"Home base" },
];
const LAST_UPDATED = "2026-09-10";

/* ---------- stats + timeline ---------- */
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmt=d=>{const[y,m]=d.split("-");return `${MONTHS[(+m||1)-1]} ${y}`;};
document.getElementById('stats').innerHTML=[
  ['Cities', new Set(PLACES.map(p=>p.city)).size],
  ['Countries', new Set(PLACES.map(p=>p.country)).size],
  ['Visits', PLACES.length],
].map(([l,n])=>`<div class="stat"><div class="n">${n}</div><div class="l">${l}</div></div>`).join('');
document.getElementById('last-updated').textContent=`Last updated ${LAST_UPDATED}`;

const byYear={};
PLACES.forEach((p,i)=>{const y=p.date.split('-')[0];(byYear[y]=byYear[y]||[]).push({...p,_i:i});});
document.getElementById('timeline').innerHTML=Object.keys(byYear).sort((a,b)=>b-a).map(y=>`
  <div class="year-block"><div class="year-label">${y}</div>
  ${byYear[y].sort((a,b)=>b.date.localeCompare(a.date)).map(p=>`
    <div class="entry" data-i="${p._i}" role="button" tabindex="0">
      <div><span class="city">${p.city}</span><span class="country">${p.country}${p.note?` &middot; ${p.note}`:''}</span></div>
      <div class="when">${fmt(p.date)}</div>
    </div>`).join('')}</div>`).join('');

/* ---------- dotted globe ---------- */
const canvas=document.getElementById('globe'), ctx=canvas.getContext('2d'), tip=document.getElementById('globe-tip');
let W=600,H=600,dpr=Math.min(window.devicePixelRatio||1,2);
let rotate=[-100,-18,0], DOTS=[], activeIdx=-1, dragging=false, flying=false, hovering=false;
const projection=d3.geoOrthographic().rotate(rotate).clipAngle(90).precision(0.5);

function resize(){
  const box=canvas.parentElement.getBoundingClientRect();
  W=box.width; H=box.height;
  canvas.width=W*dpr; canvas.height=H*dpr; canvas.style.width=W+'px'; canvas.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  projection.scale(W/2-8).translate([W/2,H/2]);
  draw();
}
function facing(lng,lat){const c=projection.rotate();return Math.cos(d3.geoDistance([lng,lat],[-c[0],-c[1]]));}
function draw(){
  ctx.clearRect(0,0,W,H);
  // sphere
  ctx.beginPath();
  const p=d3.geoPath(projection,ctx); p({type:'Sphere'});
  const g=ctx.createRadialGradient(W*0.42,H*0.36,W*0.05,W/2,H/2,W/2);
  g.addColorStop(0,'#1b0e11'); g.addColorStop(0.7,'#0e0809'); g.addColorStop(1,'#080506');
  ctx.fillStyle=g; ctx.fill();
  ctx.lineWidth=1.2; ctx.strokeStyle='rgba(168,51,43,0.30)'; ctx.stroke();
  // land dots
  const r0=W/300;
  for(let i=0;i<DOTS.length;i++){
    const f=facing(DOTS[i][0],DOTS[i][1]);
    if(f<=0.05) continue;
    const xy=projection(DOTS[i]); if(!xy) continue;
    const a=Math.min(1,(f-0.02)*1.9);
    ctx.beginPath(); ctx.arc(xy[0],xy[1],r0*(0.55+0.55*f),0,6.283);
    ctx.fillStyle=`rgba(233,222,216,${(0.28+0.62*f)*a})`; ctx.fill();
  }
  // city pins
  PLACES.forEach((pl,i)=>{
    const f=facing(pl.lng,pl.lat); if(f<=0.03) return;
    const xy=projection([pl.lng,pl.lat]); if(!xy) return;
    const active=i===activeIdx;
    ctx.beginPath(); ctx.arc(xy[0],xy[1],(active?11:8)*(0.6+0.4*f),0,6.283);
    ctx.fillStyle=`rgba(255,106,84,${0.18*f})`; ctx.fill();
    ctx.beginPath(); ctx.arc(xy[0],xy[1],(active?4.6:3.4),0,6.283);
    ctx.fillStyle=active?'#FF7A63':'#F5392B'; ctx.fill();
    ctx.lineWidth=1.1; ctx.strokeStyle='rgba(255,244,242,0.9)'; ctx.stroke();
  });
}
d3.timer(()=>{ if(dragging||flying||hovering) return; rotate[0]+=0.12; projection.rotate(rotate); draw(); });

/* drag */
let s0=null,r0=null;
const pt=e=>{const r=canvas.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return[t.clientX-r.left,t.clientY-r.top];};
function down(e){dragging=true;s0=pt(e);r0=[...rotate];}
function move(e){
  if(dragging){const p=pt(e);const k=0.42;
    rotate[0]=r0[0]+(p[0]-s0[0])*k; rotate[1]=Math.max(-90,Math.min(90,r0[1]-(p[1]-s0[1])*k));
    projection.rotate(rotate); draw();
  }else{
    const p=pt(e);let hit=null;
    PLACES.forEach(pl=>{if(facing(pl.lng,pl.lat)<=0.03)return;const xy=projection([pl.lng,pl.lat]);if(xy&&Math.hypot(xy[0]-p[0],xy[1]-p[1])<11)hit=pl;});
    if(hit){hovering=true;const xy=projection([hit.lng,hit.lat]);const r=canvas.getBoundingClientRect();
      tip.style.opacity=1;tip.textContent=`${hit.city}, ${hit.country}`;tip.style.left=(r.left+xy[0])+'px';tip.style.top=(r.top+xy[1])+'px';}
    else{hovering=false;tip.style.opacity=0;}
  }
}
function up(){dragging=false;}
canvas.addEventListener('mousedown',down); window.addEventListener('mousemove',move); window.addEventListener('mouseup',up);
canvas.addEventListener('touchstart',down,{passive:true}); canvas.addEventListener('touchmove',e=>{move(e);e.preventDefault();},{passive:false}); canvas.addEventListener('touchend',up);
canvas.addEventListener('mouseleave',()=>{hovering=false;tip.style.opacity=0;});

/* fly to */
function flyTo(i){
  const p=PLACES[i]; if(!p)return; activeIdx=i;
  document.querySelectorAll('.entry').forEach(el=>el.classList.toggle('active',+el.dataset.i===i));
  const iv=d3.interpolate(rotate,[-p.lng,-p.lat,0]); flying=true;
  const t0=performance.now(),dur=1100;
  (function step(now){const k=Math.min(1,(now-t0)/dur);rotate=iv(d3.easeCubicInOut(k));projection.rotate(rotate);draw();
    if(k<1)requestAnimationFrame(step);else flying=false;})(t0);
}
document.querySelectorAll('.entry').forEach(el=>{
  el.addEventListener('click',()=>flyTo(+el.dataset.i));
  el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flyTo(+el.dataset.i);}});
});
canvas.addEventListener('click',e=>{const p=pt(e);let hit=-1;
  PLACES.forEach((pl,i)=>{if(facing(pl.lng,pl.lat)<=0.03)return;const xy=projection([pl.lng,pl.lat]);if(xy&&Math.hypot(xy[0]-p[0],xy[1]-p[1])<12)hit=i;});
  if(hit>=0)flyTo(hit);});

fetch('vendor/land-dots.json').then(r=>r.json()).then(d=>{DOTS=d;resize();}).catch(()=>resize());
window.addEventListener('resize',resize);
resize();
</script>
</body>
