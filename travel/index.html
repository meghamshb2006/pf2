<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Travel — meghamsh.b</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/mb3-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/mb3-16.png">
<link rel="apple-touch-icon" href="/assets/mb3-apple-touch.png">
<meta name="theme-color" content="#3D0F18">
<meta name="description" content="Where I've been — cities I've lived in, worked from, or passed through.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Schibsted+Grotesk:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0A0708;--ink:#F4EFEC;--muted:#C3B9B5;--dim:#988C89;--red:#A8332B;--red-bright:#F5392B;--line:rgba(255,255,255,0.10);}
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Schibsted Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased;color-scheme:dark;}
  a{color:#E6DED9;text-decoration:none;} a:hover{color:var(--red);}
  .bg-img{position:fixed;inset:0;z-index:-2;background-image:url('/assets/bg-v8.png');background-size:cover;background-position:center;}
  .bg-tint{position:fixed;inset:0;z-index:-1;background:radial-gradient(120% 80% at 30% 10%,rgba(10,6,7,0),rgba(8,5,6,0.5) 70%);}

  header{position:sticky;top:0;z-index:40;background:rgba(12,8,9,0.15);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);border-bottom:1px solid rgba(255,255,255,0.08);}
  nav{max-width:1240px;margin:0 auto;padding:14px 30px;display:flex;align-items:center;gap:22px;}
  .logo{font-family:'Instrument Serif',serif;font-style:italic;font-size:26px;line-height:1;color:var(--ink);}
  .nav-links{display:flex;align-items:center;gap:22px;font-size:14px;color:var(--dim);}
  .nav-links a{color:var(--dim);} .nav-links a.active{color:var(--ink);font-weight:600;} .nav-links a:hover{color:#fff;}
  .socials{display:flex;align-items:center;gap:14px;} .socials a{display:flex;color:var(--dim);} .socials a:hover{color:var(--red-bright);}
  .spacer{flex:1;}

  .stage{max-width:1240px;margin:0 auto;padding:0 30px;display:grid;grid-template-columns:minmax(340px,500px) 1fr;gap:40px;}
  /* LEFT column */
  .col{position:relative;z-index:2;padding:56px 0 60px;min-width:0;}
  .head{position:sticky;top:56px;}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;letter-spacing:0.24em;text-transform:uppercase;color:#F0E7E2;}
  h1{margin:6px 0 0;font-family:'Instrument Serif',serif;font-weight:400;font-size:60px;line-height:0.98;letter-spacing:-0.01em;color:#F7F1EC;}
  .subtitle{margin:18px 0 0;max-width:420px;font-size:17px;line-height:1.55;color:var(--muted);text-wrap:pretty;text-shadow:0 1px 10px rgba(0,0,0,0.5);}
  .stats{display:flex;gap:32px;margin:30px 0 24px;}
  .stat .n{font-family:'Instrument Serif',serif;font-size:42px;line-height:1;color:#F7F1EC;}
  .stat .l{margin-top:4px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:var(--dim);}
  .rule{height:1px;background:var(--line);margin:0 0 6px;}
  .timeline{margin-top:14px;}
  .year-label{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:0.14em;color:var(--dim);margin:22px 0 6px;}
  .entry{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:14px;padding:12px 10px;border-radius:10px;cursor:pointer;transition:background .18s;}
  .entry:hover,.entry.active{background:rgba(255,255,255,0.06);}
  .flag{width:30px;height:26px;display:flex;align-items:center;justify-content:center;opacity:.9;}
  .flag svg{display:block;} .flag .dot{width:7px;height:7px;border-radius:50%;background:rgba(240,235,232,0.7);}
  .entry .city{font-size:17px;font-weight:600;color:#F4EFEC;line-height:1.15;}
  .entry .country{font-size:13px;color:var(--muted);}
  .entry .when{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--dim);white-space:nowrap;}
  .entry.active .city{color:var(--red-bright);}
  .updated{margin:28px 0 0;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.08em;color:var(--dim);}

  /* RIGHT column — globe */
  .globe-col{position:relative;min-width:0;}
  .globe-wrap{position:sticky;top:96px;width:100%;max-width:600px;margin-left:auto;aspect-ratio:1;}
  .globe-wrap::before{content:"";position:absolute;inset:6%;border-radius:50%;background:radial-gradient(circle at 44% 40%,rgba(168,51,43,0.14),rgba(168,51,43,0.04) 46%,rgba(0,0,0,0) 66%);}
  #globe{position:relative;width:100%;height:100%;display:block;cursor:grab;}
  #globe:active{cursor:grabbing;}
  #globe-tip{position:fixed;pointer-events:none;transform:translate(-50%,-140%);z-index:5;background:rgba(12,8,9,0.92);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;color:var(--ink);white-space:nowrap;opacity:0;transition:opacity .15s;}

  @media (max-width:900px){
    html,body{overflow-x:hidden;}
    nav{padding:12px 16px;gap:12px;} .nav-links{display:none;}
    .stage{grid-template-columns:1fr;gap:8px;padding:0 18px;}
    .globe-col{order:-1;} .globe-wrap{position:relative;top:auto;margin:20px auto 0;width:min(78vw,360px);}
    .col{padding:18px 0 50px;} .head{position:static;}
    h1{font-size:42px;} .subtitle{font-size:16px;max-width:100%;} .stats{gap:24px;}
  }
</style>
</head>
<body>
<div class="bg-img" aria-hidden="true"></div>
<div class="bg-tint" aria-hidden="true"></div>

<header>
  <nav>
    <a href="/" class="logo">mb</a>
    <div class="spacer"></div>
    <div class="nav-links"><a href="/">Home</a><a href="/travel" class="active">Travel</a></div>
    <div class="socials">
      <a href="https://github.com/meghamshb2006" target="_blank" rel="noreferrer" aria-label="GitHub"><svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.4 7.4 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg></a>
      <a href="https://www.linkedin.com/in/meghamshbalantrapu/" target="_blank" rel="noreferrer" aria-label="LinkedIn"><svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M3.6 5.9H.9V15h2.7V5.9ZM2.25 1a1.6 1.6 0 1 0 0 3.2 1.6 1.6 0 0 0 0-3.2ZM15 15h-2.7v-4.9c0-1.23-.44-2.07-1.54-2.07-.84 0-1.34.57-1.56 1.12-.08.2-.1.47-.1.75V15H6.4s.04-8.28 0-9.1h2.7v1.29c.36-.56 1-1.35 2.45-1.35 1.79 0 3.45 1.17 3.45 3.68V15Z"/></svg></a>
      <a href="mailto:balantrapumeghamsh@gmail.com" aria-label="Email"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="1.2" y="3" width="13.6" height="10" rx="2"/><path d="m1.8 4.2 6.2 4.6 6.2-4.6"/></svg></a>
      <a href="https://www.instagram.com/meghamshb/" target="_blank" rel="noreferrer" aria-label="Instagram"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.35" aria-hidden="true"><rect x="1.6" y="1.6" width="12.8" height="12.8" rx="4"/><circle cx="8" cy="8" r="3.1"/><circle cx="11.9" cy="4.1" r="0.85" fill="currentColor" stroke="none"/></svg></a>
    </div>
  </nav>
</header>

<div class="stage">
  <div class="col">
    <div class="head">
      <div class="eyebrow">05. Travel</div>
      <h1>Where I've Been</h1>
      <p class="subtitle">Every city I've lived in, worked from, or passed through. Drag the globe, or pick a place to fly to it.</p>
      <div class="stats" id="stats"></div>
      <div class="rule"></div>
    </div>
    <div class="timeline" id="timeline"></div>
    <div class="updated" id="last-updated">Last updated —</div>
  </div>

  <div class="globe-col">
    <div class="globe-wrap"><canvas id="globe"></canvas></div>
  </div>
</div>
<div id="globe-tip"></div>

<script src="vendor/d3.min.js"></script>
<script src="vendor/topojson-client.min.js"></script>
<script>
/* ============================================================
   EDIT YOUR TRAVEL HERE — one list drives stats, globe & log.
   Each place: city, country, lat, lng, date "YYYY-MM".
   ============================================================ */
const PLACES = [
  { city:"Hong Kong",  country:"Hong Kong", lat:22.3193, lng:114.1694, date:"2025-08" },
  { city:"Jammu",      country:"India",     lat:32.7266, lng:74.8570,  date:"2024-06" },
  { city:"Bengaluru",  country:"India",     lat:12.9716, lng:77.5946,  date:"2023-06" },
  { city:"Hyderabad",  country:"India",     lat:17.3850, lng:78.4867,  date:"2006-01" },
];
const LAST_UPDATED = "2026-09-10";

const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmt=d=>{const[y,m]=d.split("-");return `${MONTHS[(+m||1)-1]} ${y}`;};
document.getElementById('stats').innerHTML=[
  ['Cities', new Set(PLACES.map(p=>p.city)).size],
  ['Countries', new Set(PLACES.map(p=>p.country)).size],
  ['Visits', PLACES.length],
].map(([l,n])=>`<div class="stat"><div class="n">${n}</div><div class="l">${l}</div></div>`).join('');
document.getElementById('last-updated').textContent=`Last updated ${LAST_UPDATED}`;

const byYear={};
PLACES.forEach((p,i)=>{const y=p.date.split('-')[0];(byYear[y]=byYear[y]||[]).push({...p,_i:i});});
document.getElementById('timeline').innerHTML=Object.keys(byYear).sort((a,b)=>b-a).map(y=>`
  <div class="year-block"><div class="year-label">${y}</div>
  ${byYear[y].sort((a,b)=>b.date.localeCompare(a.date)).map(p=>`
    <div class="entry" data-i="${p._i}" data-country="${p.country}" role="button" tabindex="0">
      <span class="flag"><span class="dot"></span></span>
      <div><div class="city">${p.city}</div><div class="country">${p.country}</div></div>
      <div class="when">${fmt(p.date)}</div>
    </div>`).join('')}</div>`).join('');

/* ---------- dotted globe ---------- */
const wrap=document.querySelector('.globe-wrap'), canvas=document.getElementById('globe'), ctx=canvas.getContext('2d'), tip=document.getElementById('globe-tip');
let W=560,H=560,dpr=1,DOTS=[],activeIdx=-1,dragging=false,flying=false,hovering=false;
let rotate=[-100,-18,0];
const projection=d3.geoOrthographic().rotate(rotate).clipAngle(90).precision(0.5);

function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  const w=wrap.clientWidth||560; W=w; H=w;
  canvas.width=Math.round(W*dpr); canvas.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  projection.scale(W/2-10).translate([W/2,H/2]);
  draw();
}
function facing(lng,lat){const c=projection.rotate();return Math.cos(d3.geoDistance([lng,lat],[-c[0],-c[1]]));}
function draw(){
  ctx.clearRect(0,0,W,H);
  const p=d3.geoPath(projection,ctx);
  ctx.beginPath(); p({type:'Sphere'});
  const g=ctx.createRadialGradient(W*0.42,H*0.36,W*0.05,W/2,H/2,W/2);
  g.addColorStop(0,'#15100F'); g.addColorStop(0.72,'#0B0808'); g.addColorStop(1,'#070505');
  ctx.fillStyle=g; ctx.fill();
  ctx.lineWidth=1.1; ctx.strokeStyle='rgba(168,51,43,0.26)'; ctx.stroke();
  const r0=W/310;
  for(let i=0;i<DOTS.length;i++){
    const f=facing(DOTS[i][0],DOTS[i][1]); if(f<=0.05) continue;
    const xy=projection(DOTS[i]); if(!xy) continue;
    const a=Math.min(1,(f-0.02)*1.9);
    ctx.beginPath(); ctx.arc(xy[0],xy[1],r0*(0.55+0.55*f),0,6.283);
    ctx.fillStyle=`rgba(228,220,214,${(0.26+0.6*f)*a})`; ctx.fill();
  }
  PLACES.forEach((pl,i)=>{
    const f=facing(pl.lng,pl.lat); if(f<=0.03) return;
    const xy=projection([pl.lng,pl.lat]); if(!xy) return;
    const active=i===activeIdx;
    ctx.beginPath(); ctx.arc(xy[0],xy[1],(active?11:8)*(0.6+0.4*f),0,6.283);
    ctx.fillStyle=`rgba(255,106,84,${0.18*f})`; ctx.fill();
    ctx.beginPath(); ctx.arc(xy[0],xy[1],(active?4.6:3.4),0,6.283);
    ctx.fillStyle=active?'#FF7A63':'#F5392B'; ctx.fill();
    ctx.lineWidth=1.1; ctx.strokeStyle='rgba(255,244,242,0.9)'; ctx.stroke();
  });
}
d3.timer(()=>{ if(dragging||flying||hovering) return; rotate[0]+=0.12; projection.rotate(rotate); draw(); });

let s0=null,r0=null;
const pt=e=>{const r=canvas.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return[t.clientX-r.left,t.clientY-r.top];};
function down(e){dragging=true;s0=pt(e);r0=[...rotate];}
function move(e){
  if(dragging){const q=pt(e);const k=0.42;
    rotate[0]=r0[0]+(q[0]-s0[0])*k; rotate[1]=Math.max(-90,Math.min(90,r0[1]-(q[1]-s0[1])*k));
    projection.rotate(rotate); draw();
  }else{
    const q=pt(e);let hit=null;
    PLACES.forEach(pl=>{if(facing(pl.lng,pl.lat)<=0.03)return;const xy=projection([pl.lng,pl.lat]);if(xy&&Math.hypot(xy[0]-q[0],xy[1]-q[1])<11)hit=pl;});
    if(hit){hovering=true;const xy=projection([hit.lng,hit.lat]);const r=canvas.getBoundingClientRect();
      tip.style.opacity=1;tip.textContent=`${hit.city}, ${hit.country}`;tip.style.left=(r.left+xy[0])+'px';tip.style.top=(r.top+xy[1])+'px';}
    else{hovering=false;tip.style.opacity=0;}
  }
}
function up(){dragging=false;}
canvas.addEventListener('mousedown',down); window.addEventListener('mousemove',move); window.addEventListener('mouseup',up);
canvas.addEventListener('touchstart',down,{passive:true}); canvas.addEventListener('touchmove',e=>{move(e);e.preventDefault();},{passive:false}); canvas.addEventListener('touchend',up);
canvas.addEventListener('mouseleave',()=>{hovering=false;tip.style.opacity=0;});

function flyTo(i){
  const pl=PLACES[i]; if(!pl)return; activeIdx=i;
  document.querySelectorAll('.entry').forEach(el=>el.classList.toggle('active',+el.dataset.i===i));
  const iv=d3.interpolate(rotate,[-pl.lng,-pl.lat,0]); flying=true; const t0=performance.now(),dur=1100;
  (function step(now){const k=Math.min(1,(now-t0)/dur);rotate=iv(d3.easeCubicInOut(k));projection.rotate(rotate);draw();
    if(k<1)requestAnimationFrame(step);else flying=false;})(t0);
}
document.querySelectorAll('.entry').forEach(el=>{
  el.addEventListener('click',()=>flyTo(+el.dataset.i));
  el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flyTo(+el.dataset.i);}});
});
canvas.addEventListener('click',e=>{const q=pt(e);let hit=-1;
  PLACES.forEach((pl,i)=>{if(facing(pl.lng,pl.lat)<=0.03)return;const xy=projection([pl.lng,pl.lat]);if(xy&&Math.hypot(xy[0]-q[0],xy[1]-q[1])<12)hit=i;});
  if(hit>=0)flyTo(hit);});

/* country-shape icons in the log */
const ALIAS={'usa':'United States of America','us':'United States of America','united states':'United States of America','uk':'United Kingdom','uae':'United Arab Emirates','south korea':'South Korea','russia':'Russia'};
fetch('vendor/countries-110m.json').then(r=>r.json()).then(world=>{
  const feats=topojson.feature(world,world.objects.countries).features;
  const nmeshBy={}; feats.forEach(f=>{ if(f.properties&&f.properties.name) nmeshBy[f.properties.name.toLowerCase()]=f; });
  const featFor=name=>{const k=name.toLowerCase(); return nameHit(k)||nameHit((ALIAS[k]||'').toLowerCase());};
  function nameHit(k){return k&&nmeshBy[k]?nmeshBy[k]:null;}
  document.querySelectorAll('.entry .flag').forEach(el=>{
    const c=el.closest('.entry').dataset.country; const f=featFor(c); if(!f) return;
    const pr=d3.geoMercator().fitExtent([[2,2],[28,22]],f);
    const d=d3.geoPath(pr)(f); if(!d) return;
    el.innerHTML=`<svg width="30" height="24" viewBox="0 0 30 24" aria-hidden="true"><path d="${d}" fill="rgba(233,224,218,0.9)" stroke="rgba(255,255,255,0.14)" stroke-width="0.3"/></svg>`;
  });
});

fetch('vendor/land-dots.json').then(r=>r.json()).then(d=>{DOTS=d;resize();}).catch(()=>resize());
new ResizeObserver(resize).observe(wrap);
window.addEventListener('resize',resize);
resize();
</script>
</body>
</html>
